<text x="30" y="470" font-size="10" font-weight="bold" fill="#333">Guide:</text><text x="30" y="486" font-size="9" fill="#555">→ Power loop (thick traces, keep short)</text><text x="30" y="500" font-size="9" fill="#555">→ Keep control IC away from inductor magnetic field</text><text x="30" y="514" font-size="9" fill="#555">→ Place decoupling caps within 5mm of IC pins</text><text x="30" y="528" font-size="9" fill="#555">→ GND copper pour on bottom layer, vias to top GND islands</text></svg>