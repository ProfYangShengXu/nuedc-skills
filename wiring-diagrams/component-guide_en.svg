<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
  <rect width="700" height="600" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Component Shopping Guide</text>

    <rect x="30" y="50" width="640" height="35" rx="5" fill="#1565c0"/>
    <text x="350" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Essential Components (Budget ~$5-15 USD)</text>
    <rect x="30" y="85" width="280" height="25" rx="3" fill="#e3f2fd"/>
    <text x="170" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Component</text>
    <rect x="310" y="85" width="360" height="25" rx="3" fill="#e3f2fd"/>
    <text x="450" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Description / Buying Tips</text>
    <rect x="30" y="125" width="280" height="28" fill="#fff"/>
    <text x="170" y="143" text-anchor="middle" font-size="10" fill="#333">① STM32 Dev Board</text>
    <rect x="310" y="125" width="360" height="28" fill="#fff"/>
    <text x="450" y="143" text-anchor="middle" font-size="9" fill="#666">$2-4 | STM32F103C8T6 Blue Pill | Pre-soldered headers</text>
    <rect x="30" y="153" width="280" height="28" fill="#f5f5f5"/>
    <text x="170" y="171" text-anchor="middle" font-size="10" fill="#333">② ST-Link V2 Debugger</text>
    <rect x="310" y="153" width="360" height="28" fill="#f5f5f5"/>
    <text x="450" y="171" text-anchor="middle" font-size="9" fill="#666">$1.5-3 | SWD interface | Get genuine-compatible</text>
    <rect x="30" y="181" width="280" height="28" fill="#fff"/>
    <text x="170" y="199" text-anchor="middle" font-size="10" fill="#333">③ Dupont Wires (F/F)</text>
    <rect x="310" y="181" width="360" height="28" fill="#fff"/>
    <text x="450" y="199" text-anchor="middle" font-size="9" fill="#666">$0.5-1 | At least 4: Red/Black/Yellow/Green</text>
    <rect x="30" y="209" width="280" height="28" fill="#f5f5f5"/>
    <text x="170" y="227" text-anchor="middle" font-size="10" fill="#333">④ USB Data Cable</text>
    <rect x="310" y="209" width="360" height="28" fill="#f5f5f5"/>
    <text x="450" y="227" text-anchor="middle" font-size="9" fill="#666">$1-2 | Micro-USB or Type-C | Data-capable</text>
    <rect x="30" y="237" width="280" height="28" fill="#fff"/>
    <text x="170" y="255" text-anchor="middle" font-size="10" fill="#333">⑤ Breadboard 830pt</text>
    <rect x="310" y="237" width="360" height="28" fill="#fff"/>
    <text x="450" y="255" text-anchor="middle" font-size="9" fill="#666">$1-2 | Optional, for complex circuits</text>
    <rect x="30" y="265" width="280" height="28" fill="#f5f5f5"/>
    <text x="170" y="283" text-anchor="middle" font-size="10" fill="#333">⑥ LED + Resistor kit</text>
    <rect x="310" y="265" width="360" height="28" fill="#f5f5f5"/>
    <text x="450" y="283" text-anchor="middle" font-size="9" fill="#666">$0.5-1 | 5mm LEDs + 220Ω/1kΩ resistors</text>
    <rect x="30" y="293" width="280" height="28" fill="#fff"/>
    <text x="170" y="311" text-anchor="middle" font-size="10" fill="#333">⑦ Jumper Wires (M/M)</text>
    <rect x="310" y="293" width="360" height="28" fill="#fff"/>
    <text x="450" y="311" text-anchor="middle" font-size="9" fill="#666">$0.5-1 | Needed with breadboard</text>
    <rect x="30" y="331" width="640" height="30" rx="5" fill="#e8f5e9"/>
    <text x="350" y="351" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">🔑 Core: Dev Board + Debugger + Dupont Wires = $4-8</text>
    <rect x="30" y="381" width="640" height="162" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
    <text x="50" y="403" font-size="13" font-weight="bold" fill="#e65100">💡 Shopping Tips</text>
    <text x="50" y="426" font-size="10" fill="#795548">▸ Beginners: STM32F103C8T6 (most tutorials)</text>
    <text x="50" y="448" font-size="10" fill="#795548">▸ ST-Link V2: buy reverse-polarity protected</text>
    <text x="50" y="470" font-size="10" fill="#795548">▸ Dupont wires: 20cm length recommended</text>
    <text x="50" y="492" font-size="10" fill="#795548">▸ Starter pack: board + ST-Link bundle saves money</text>
    <text x="50" y="514" font-size="10" fill="#795548">▸ Avoid ultra-cheap ST-Link clones (firmware issues)</text>
    <text x="50" y="536" font-size="10" fill="#795548">▸ Breadboard with power rails recommended</text>
    <rect x="30" y="553" width="640" height="45" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
    <text x="50" y="573" font-size="12" font-weight="bold" fill="#c62828">⚠️ Common Mistakes</text>
    <text x="50" y="591" font-size="10" fill="#c62828">x Buy Cortex-M series STM32 | x Buy female-to-female dupont wires</text></svg>
